spring.application.name=app

# --- PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5432/loan_app
spring.datasource.username=user
spring.datasource.password=password

# --- JPA: let Liquibase own the schema; just validate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Liquibase ---
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.clear-checksums=true

logging.level.liquibase=DEBUG
logging.level.org.springframework.boot.autoconfigure.liquibase=DEBUG

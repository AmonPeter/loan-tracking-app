<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports | Loan Tracking App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        .reports-shell { max-width: 76rem; }
        .report-banner {
            background: linear-gradient(125deg, #0f172a, #1e3a8a 52%, #0b766e);
            color: #fff;
            border-radius: 8px;
            padding: 1.1rem 1.25rem;
        }
        .report-title { margin: 0; font-size: 1.25rem; font-weight: 700; }
        .report-subtitle { margin: 0.35rem 0 0; color: rgba(255,255,255,0.88); font-size: 0.92rem; }
        .surface-card {
            border: 1px solid #dbe4f0;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
        }
        .section-title {
            margin: 0;
            font-size: 0.9rem;
            font-weight: 700;
            color: #52607a;
            text-transform: uppercase;
        }
        .report-table thead th {
            font-size: 0.78rem;
            text-transform: uppercase;
            color: #52607a;
            background: #f8fafc;
            white-space: nowrap;
        }
        .report-table td { vertical-align: middle; }
        .amount-cell { text-align: right; font-variant-numeric: tabular-nums; }
    </style>
</head>
<body class="bg-body-tertiary">
<header th:replace="~{fragments/header :: siteHeader('reports')}"></header>

<main class="container py-4 reports-shell">
    <section class="report-banner mb-3">
        <h1 class="report-title">Reports</h1>
        <p class="report-subtitle">Loan portfolio performance and balance tracking by reporting period.</p>
    </section>

    <div class="card surface-card mb-3">
        <div class="card-body">
            <form method="get" action="/reports" class="row g-3 align-items-end">
                <div class="col-12 col-md-3">
                    <label class="form-label">From Month</label>
                    <select name="fromMonth" class="form-select" required>
                        <option th:each="m : ${reportMonths}" th:value="${m}" th:text="${m}" th:selected="${m == selectedFromMonth}"></option>
                    </select>
                </div>
                <div class="col-12 col-md-3">
                    <label class="form-label">From Year</label>
                    <select name="fromYear" class="form-select" required>
                        <option th:each="y : ${reportYears}" th:value="${y}" th:text="${y}" th:selected="${y == selectedFromYear}"></option>
                    </select>
                </div>
                <div class="col-12 col-md-3">
                    <label class="form-label">To Month</label>
                    <select name="toMonth" class="form-select" required>
                        <option th:each="m : ${reportMonths}" th:value="${m}" th:text="${m}" th:selected="${m == selectedToMonth}"></option>
                    </select>
                </div>
                <div class="col-12 col-md-3">
                    <label class="form-label">To Year</label>
                    <select name="toYear" class="form-select" required>
                        <option th:each="y : ${reportYears}" th:value="${y}" th:text="${y}" th:selected="${y == selectedToYear}"></option>
                    </select>
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label">Loan Type</label>
                    <select name="loanType" class="form-select">
                        <option value="">All loan types</option>
                        <option th:each="loanTypeOption : ${loanTypes}" th:value="${loanTypeOption}" th:text="${loanTypeOption}" th:selected="${loanTypeOption == selectedLoanType}"></option>
                    </select>
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label">Region</label>
                    <select name="region" class="form-select">
                        <option value="">All regions</option>
                        <option th:each="regionOption : ${regions}" th:value="${regionOption}" th:text="${regionOption}" th:selected="${regionOption == selectedRegion}"></option>
                    </select>
                </div>
                <div class="col-12 d-flex justify-content-end gap-2">
                    <a href="/reports" class="btn btn-outline-secondary">Reset</a>
                    <button type="submit" class="btn btn-primary">Apply Filters</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card surface-card">
        <div class="card-body">
            <h2 class="section-title mb-3">Loan Balance Report</h2>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0 report-table">
                    <thead>
                    <tr>
                        <th>Loan Number</th>
                        <th>Loan Start Date</th>
                        <th>Loan End Date</th>
                        <th class="text-end">Disbursed Amount</th>
                        <th class="text-end">Opening Balance</th>
                        <th class="text-end">Interest to be Owned</th>
                        <th class="text-end">Amount Paid so Far</th>
                        <th class="text-end">Closing Balance</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="row : ${rows}">
                        <td th:text="${'#' + row.loanNumber}"></td>
                        <td th:text="${#temporals.format(row.loanStartDate, 'dd MMM yyyy')}"></td>
                        <td th:text="${#temporals.format(row.loanEndDate, 'dd MMM yyyy')}"></td>
                        <td class="amount-cell" th:text="${#numbers.formatDecimal(row.disbursedAmount, 1, 'COMMA', 2, 'POINT')}"></td>
                        <td class="amount-cell" th:text="${#numbers.formatDecimal(row.openingBalance, 1, 'COMMA', 2, 'POINT')}"></td>
                        <td class="amount-cell" th:text="${#numbers.formatDecimal(row.interestToBeOwned, 1, 'COMMA', 2, 'POINT')}"></td>
                        <td class="amount-cell" th:text="${#numbers.formatDecimal(row.amountPaidSoFar, 1, 'COMMA', 2, 'POINT')}"></td>
                        <td class="amount-cell fw-semibold" th:text="${#numbers.formatDecimal(row.closingBalance, 1, 'COMMA', 2, 'POINT')}"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(rows)}">
                        <td colspan="8" class="text-center text-body-secondary py-4">No report data available for selected filters.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Loan | Loan Tracking App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-body-tertiary">
<header th:replace="~{fragments/header :: siteHeader('loans')}"></header>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 mb-0">Create Loan</h1>
        <a class="btn btn-outline-secondary btn-sm" href="/loans">Back to Loans</a>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form method="post" action="/loans/create" class="row g-3">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="col-12">
                    <label class="form-label">Project Description</label>
                    <textarea name="projectDescription" class="form-control" rows="2" required></textarea>
                </div>
                <div class="col-12 col-md-6"><label class="form-label">Applicant First Name</label><input name="applicantFirstName" class="form-control" required></div>
                <div class="col-12 col-md-6"><label class="form-label">Applicant Surname</label><input name="applicantSurname" class="form-control" required></div>
                <div class="col-12 col-md-4"><label class="form-label">Applicant ID Number</label><input name="applicantIdNumber" class="form-control" required></div>
                <div class="col-12 col-md-4"><label class="form-label">Contact Number</label><input name="contactNumber" class="form-control" required></div>
                <div class="col-12 col-md-4">
                    <label class="form-label">Region</label>
                    <select name="region" class="form-select" required>
                        <option value="" selected disabled>Select region</option>
                        <option th:each="region : ${regions}" th:value="${region}" th:text="${region}"></option>
                    </select>
                </div>
                <div class="col-12 col-md-4"><label class="form-label">Town/Village</label><input name="townVillage" class="form-control" required></div>
                <div class="col-12 col-md-4">
                    <label class="form-label">Membership</label>
                    <select name="membershipStatus" class="form-select" required>
                        <option value="" selected disabled>Select membership</option>
                        <option th:each="membership : ${membershipOptions}" th:value="${membership}" th:text="${membership}"></option>
                    </select>
                </div>
                <div class="col-12 col-md-4">
                    <label class="form-label">Gender</label>
                    <select name="gender" class="form-select" required>
                        <option value="" selected disabled>Select gender</option>
                        <option th:each="gender : ${genders}" th:value="${gender}" th:text="${gender}"></option>
                    </select>
                </div>
                <div class="col-12"><label class="form-label">Conditions Precedent</label><textarea name="conditionsPrecedent" class="form-control" rows="2"></textarea></div>
                <div class="col-12 col-md-4"><label class="form-label">Interest Rate (%)</label><input name="interestRate" type="number" step="0.01" min="0" class="form-control" required></div>
                <div class="col-12 col-md-4">
                    <label class="form-label">Loan Type</label>
                    <select name="loanType" class="form-select" required>
                        <option value="" selected disabled>Select loan type</option>
                        <option th:each="loanType : ${loanTypes}" th:value="${loanType}" th:text="${loanType}"></option>
                    </select>
                </div>
                <div class="col-12 col-md-4">
                    <label class="form-label">Loan Status</label>
                    <select name="loanStatus" class="form-select" required>
                        <option value="" selected disabled>Select loan status</option>
                        <option th:each="loanStatus : ${loanStatuses}" th:value="${loanStatus}" th:text="${loanStatus}"></option>
                    </select>
                </div>
                <div class="col-12 col-md-6"><label class="form-label">Loan Status Comment</label><textarea name="loanStatusComment" class="form-control" rows="2"></textarea></div>
                <div class="col-12 col-md-6"><label class="form-label">Loan Conditions</label><textarea name="loanConditions" class="form-control" rows="2"></textarea></div>
                <div class="col-12 col-md-6"><label class="form-label">Approved Amount</label><input name="approvedAmount" type="number" step="0.01" min="0" class="form-control" data-approved-amount required></div>
                <div class="col-12 col-md-6"><label class="form-label">Disbursed Amount</label><input name="disbursedAmount" type="number" step="0.01" min="0" class="form-control" data-disbursed-amount required></div>
                <div class="col-12"><button type="submit" class="btn btn-primary">Create Loan</button></div>
            </form>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script>
    function wireAmountValidation(root) {
        const approved = root.querySelector("[data-approved-amount]");
        const disbursed = root.querySelector("[data-disbursed-amount]");
        if (!approved || !disbursed) return;

        const validate = () => {
            const approvedValue = parseFloat(approved.value);
            const disbursedValue = parseFloat(disbursed.value);
            if (!Number.isNaN(approvedValue) && !Number.isNaN(disbursedValue) && disbursedValue > approvedValue) {
                disbursed.setCustomValidity("Disbursed Amount cannot be greater than Approved Amount.");
            } else {
                disbursed.setCustomValidity("");
            }
        };

        approved.addEventListener("input", validate);
        disbursed.addEventListener("input", validate);
    }

    wireAmountValidation(document);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Loan Tracking App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        body {
            min-height: 100vh;
            background: radial-gradient(circle at top right, #1e3a8a 0%, #0f172a 40%, #0b1220 100%);
        }
        .login-shell {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .login-card {
            width: 100%;
            max-width: 26rem;
            border: 1px solid #dbe4f0;
            border-radius: 8px;
            box-shadow: 0 16px 34px rgba(15, 23, 42, 0.28);
        }
        .login-header {
            background: linear-gradient(120deg, #0f172a, #1f3f85);
            color: #fff;
            border-radius: 8px 8px 0 0;
            padding: 1.1rem 1.2rem;
        }
        .login-title {
            margin: 0;
            font-size: 1.15rem;
            font-weight: 700;
        }
        .login-subtitle {
            margin: 0.35rem 0 0;
            color: rgba(255, 255, 255, 0.86);
            font-size: 0.9rem;
        }
        .form-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 0.35rem;
        }
        .form-control {
            border-radius: 8px;
            border-color: #d2dbea;
            min-height: 2.6rem;
        }
        .form-control:focus {
            border-color: #1f3f85;
            box-shadow: 0 0 0 0.2rem rgba(31, 63, 133, 0.16);
        }
    </style>
</head>
<body>
<main class="login-shell">
    <div class="card login-card">
        <div class="login-header">
            <h1 class="login-title">Loan Tracking App</h1>
            <p class="login-subtitle">Sign in to continue</p>
        </div>
        <div class="card-body p-4">
            <div th:if="${param.error}" class="alert alert-danger py-2" role="alert">
                Invalid email or password.
            </div>
            <div th:if="${param.logout}" class="alert alert-success py-2" role="alert">
                You have been signed out.
            </div>
            <form method="post" action="/login" class="row g-3">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="col-12">
                    <label class="form-label" for="username">Email</label>
                    <input id="username" name="username" type="text" class="form-control" autocomplete="username" required autofocus>
                </div>
                <div class="col-12">
                    <label class="form-label" for="password">Password</label>
                    <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required>
                </div>
                <div class="col-12 d-grid mt-2">
                    <button type="submit" class="btn btn-primary">Sign In</button>
                </div>
            </form>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>

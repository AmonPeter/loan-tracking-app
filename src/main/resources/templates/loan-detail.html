<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Detail | Loan Tracking App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        .detail-shell {
            max-width: 64rem;
        }
        .page-banner {
            background: linear-gradient(125deg, #0f172a, #1e3a8a 52%, #0b766e);
            color: #fff;
            border-radius: 8px;
            padding: 1.1rem 1.25rem;
        }
        .page-title {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 700;
        }
        .page-subtitle {
            margin: 0.35rem 0 0;
            color: rgba(255, 255, 255, 0.88);
            font-size: 0.92rem;
        }
        .surface-card {
            border: 1px solid #dbe4f0;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
        }
        .section-title {
            margin: 0 0 1rem;
            font-size: 0.9rem;
            font-weight: 700;
            color: #52607a;
            text-transform: uppercase;
        }
        .form-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 0.35rem;
        }
        .form-control,
        .form-select {
            border-radius: 8px;
            border-color: #d2dbea;
            min-height: 2.5rem;
        }
        textarea.form-control {
            min-height: auto;
        }
        .form-control:focus,
        .form-select:focus {
            border-color: #1f3f85;
            box-shadow: 0 0 0 0.2rem rgba(31, 63, 133, 0.16);
        }
        .actions-row {
            border-top: 1px solid #e8edf5;
            padding-top: 1rem;
            margin-top: 0.25rem;
        }
    </style>
</head>
<body class="bg-body-tertiary">
<header th:replace="~{fragments/header :: siteHeader('loans')}"></header>

<main class="container py-4 detail-shell">
    <div class="page-banner mb-3 d-flex justify-content-between align-items-start gap-3">
        <div>
            <h1 class="page-title" th:text="${'Loan ' + '#' + loan.id}"></h1>
            <p class="page-subtitle">Review and update all captured details for this loan file.</p>
        </div>
        <a class="btn btn-outline-secondary btn-sm" href="/loans">Back to Loans</a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" role="alert" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>

    <div class="card surface-card">
        <div class="card-body">
            <form method="post" th:action="@{/loans/{id}(id=${loan.id})}" class="row g-3">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="col-12">
                    <h2 class="section-title">Loan Application Details</h2>
                </div>
                <div class="col-12"><label class="form-label">Project Description</label><textarea name="projectDescription" class="form-control" rows="2" th:text="${loan.projectDescription}" required></textarea></div>
                <div class="col-12 col-md-6"><label class="form-label">Applicant First Name</label><input name="applicantFirstName" class="form-control" th:value="${loan.applicantFirstName}" required></div>
                <div class="col-12 col-md-6"><label class="form-label">Applicant Surname</label><input name="applicantSurname" class="form-control" th:value="${loan.applicantSurname}" required></div>
                <div class="col-12 col-md-4"><label class="form-label">Applicant ID Number</label><input name="applicantIdNumber" class="form-control" th:value="${loan.applicantIdNumber}" required></div>
                <div class="col-12 col-md-4"><label class="form-label">Contact Number</label><input name="contactNumber" class="form-control" th:value="${loan.contactNumber}" required></div>
                <div class="col-12 col-md-4">
                    <label class="form-label">Region</label>
                    <select name="region" class="form-select" required>
                        <option th:each="region : ${regions}" th:value="${region}" th:text="${region}" th:selected="${loan.region == region}"></option>
                    </select>
                </div>
                <div class="col-12 col-md-4"><label class="form-label">Town/Village</label><input name="townVillage" class="form-control" th:value="${loan.townVillage}" required></div>
                <div class="col-12 col-md-4">
                    <label class="form-label">Membership</label>
                    <select name="membershipStatus" class="form-select" required>
                        <option th:each="membership : ${membershipOptions}" th:value="${membership}" th:text="${membership}" th:selected="${loan.membershipStatus == membership}"></option>
                    </select>
                </div>
                <div class="col-12 col-md-4">
                    <label class="form-label">Gender</label>
                    <select name="gender" class="form-select" required>
                        <option th:each="gender : ${genders}" th:value="${gender}" th:text="${gender}" th:selected="${loan.gender == gender}"></option>
                    </select>
                </div>
                <div class="col-12"><label class="form-label">Conditions Precedent</label><textarea name="conditionsPrecedent" class="form-control" rows="2" th:text="${loan.conditionsPrecedent}"></textarea></div>
                <div class="col-12 col-md-4"><label class="form-label">Interest Rate (%)</label><input name="interestRate" type="number" step="0.01" min="0" class="form-control" th:value="${loan.interestRate}" required></div>
                <div class="col-12 col-md-4">
                    <label class="form-label">Loan Type</label>
                    <select name="loanType" class="form-select" required>
                        <option th:each="loanType : ${loanTypes}" th:value="${loanType}" th:text="${loanType}" th:selected="${loan.loanType == loanType}"></option>
                    </select>
                </div>
                <div class="col-12 col-md-4">
                    <label class="form-label">Duration (Months)</label>
                    <select name="durationMonths" class="form-select" required>
                        <option th:each="duration : ${loanDurations}" th:value="${duration}" th:text="${duration}" th:selected="${loan.durationMonths == duration}"></option>
                    </select>
                </div>
                <div class="col-12 col-md-4">
                    <label class="form-label">Grace Period (Days)</label>
                    <select name="gracePeriodDays" class="form-select" required>
                        <option th:each="days : ${gracePeriodDaysOptions}" th:value="${days}" th:text="${days}" th:selected="${loan.gracePeriodDays == days}"></option>
                    </select>
                </div>
                <div class="col-12 col-md-4">
                    <label class="form-label">Loan Status</label>
                    <select name="loanStatus" class="form-select" data-loan-status required>
                        <option th:each="loanStatus : ${loanStatuses}" th:value="${loanStatus}" th:text="${loanStatus}" th:selected="${loan.loanStatus == loanStatus}"></option>
                    </select>
                </div>
                <div class="col-12 col-md-4">
                    <label class="form-label">Repayment Start Month</label>
                    <select name="repaymentStartMonth" class="form-select" data-repayment-month>
                        <option value="">Select month</option>
                        <option th:each="month : ${repaymentStartMonths}" th:value="${month}" th:text="${month}" th:selected="${loan.repaymentStartMonth == month}"></option>
                    </select>
                </div>
                <div class="col-12 col-md-4">
                    <label class="form-label">Repayment Start Year</label>
                    <select name="repaymentStartYear" class="form-select" data-repayment-year>
                        <option value="">Select year</option>
                        <option th:each="year : ${repaymentStartYears}" th:value="${year}" th:text="${year}" th:selected="${loan.repaymentStartYear == year}"></option>
                    </select>
                </div>
                <div class="col-12 col-md-4">
                    <label class="form-label">Repayment Start Date</label>
                    <select name="repaymentStartDate" class="form-select" data-repayment-date>
                        <option value="">Select date</option>
                        <option th:each="date : ${repaymentStartDates}" th:value="${date}" th:text="${date == 1 ? '1st' : '15th'}" th:selected="${loan.repaymentStartDate == date}"></option>
                    </select>
                </div>
                <div class="col-12 col-md-6"><label class="form-label">Loan Status Comment</label><textarea name="loanStatusComment" class="form-control" rows="2" th:text="${loan.loanStatusComment}"></textarea></div>
                <div class="col-12 col-md-6"><label class="form-label">Loan Conditions</label><textarea name="loanConditions" class="form-control" rows="2" th:text="${loan.loanConditions}"></textarea></div>
                <div class="col-12 col-md-6"><label class="form-label">Approved Amount</label><input name="approvedAmount" type="number" step="0.01" min="0" class="form-control" data-approved-amount th:value="${loan.approvedAmount}" required></div>
                <div class="col-12 col-md-6"><label class="form-label">Disbursed Amount</label><input name="disbursedAmount" type="number" step="0.01" min="0" class="form-control" data-disbursed-amount th:value="${loan.disbursedAmount}" required></div>
                <div class="col-12 actions-row d-flex justify-content-end">
                    <button type="submit" class="btn btn-primary px-4">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script>
    function wireAmountValidation(root) {
        const approved = root.querySelector("[data-approved-amount]");
        const disbursed = root.querySelector("[data-disbursed-amount]");
        if (!approved || !disbursed) return;

        const validate = () => {
            const approvedValue = parseFloat(approved.value);
            const disbursedValue = parseFloat(disbursed.value);
            if (!Number.isNaN(approvedValue) && !Number.isNaN(disbursedValue) && disbursedValue > approvedValue) {
                disbursed.setCustomValidity("Disbursed Amount cannot be greater than Approved Amount.");
            } else {
                disbursed.setCustomValidity("");
            }
        };

        approved.addEventListener("input", validate);
        disbursed.addEventListener("input", validate);
    }

    wireAmountValidation(document);

    function wireRepaymentStartValidation(root) {
        const status = root.querySelector("[data-loan-status]");
        const month = root.querySelector("[data-repayment-month]");
        const year = root.querySelector("[data-repayment-year]");
        const date = root.querySelector("[data-repayment-date]");
        if (!status || !month || !year || !date) return;

        const sync = () => {
            const isApproved = status.value === "Approved";
            month.required = isApproved;
            year.required = isApproved;
            date.required = isApproved;
            if (!isApproved) {
                month.setCustomValidity("");
                year.setCustomValidity("");
                date.setCustomValidity("");
                return;
            }
            month.setCustomValidity(month.value ? "" : "Select repayment start month.");
            year.setCustomValidity(year.value ? "" : "Select repayment start year.");
            date.setCustomValidity(date.value ? "" : "Select repayment start date.");
        };

        status.addEventListener("change", sync);
        month.addEventListener("change", sync);
        year.addEventListener("change", sync);
        date.addEventListener("change", sync);
        sync();
    }

    wireRepaymentStartValidation(document);
</script>
</body>
</html>

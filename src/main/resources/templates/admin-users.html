<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Users | Loan Tracking App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-body-tertiary">
<header th:replace="~{fragments/header :: siteHeader('users')}"></header>

<main class="container py-4">
    <div class="row g-4">
        <div class="col-12 col-lg-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h1 class="h5 mb-3">Add User</h1>
                    <form method="post" action="/admin/users" class="row g-3">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div class="col-12">
                            <label for="email" class="form-label">Email</label>
                            <input id="email" name="email" type="email" class="form-control" required>
                        </div>
                        <div class="col-12">
                            <label for="password" class="form-label">Password</label>
                            <input id="password" name="password" type="password" class="form-control" minlength="8" required>
                        </div>
                        <div class="col-12">
                            <label for="role" class="form-label">Role</label>
                            <select id="role" name="role" class="form-select">
                                <option value="USER" selected>USER</option>
                                <option value="ADMIN">ADMIN</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <div class="form-check">
                                <input id="enabled" name="enabled" type="checkbox" class="form-check-input" checked>
                                <label for="enabled" class="form-check-label">Enabled</label>
                            </div>
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-primary w-100">Create User</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-12 col-lg-8">
            <div th:if="${successMessage}" class="alert alert-success" role="alert" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>

            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="h5 mb-3">Users</h2>
                    <div class="d-grid gap-3">
                        <form method="post" th:each="user : ${users}" th:action="@{/admin/users/{id}(id=${user.id})}" class="border rounded p-3 bg-white">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <div class="row g-3 align-items-end">
                                <div class="col-12 col-md-4">
                                    <label class="form-label mb-1">Email</label>
                                    <div class="form-control-plaintext py-0" th:text="${user.email}"></div>
                                </div>
                                <div class="col-6 col-md-2">
                                    <label class="form-label mb-1">Role</label>
                                    <select name="role" class="form-select form-select-sm">
                                        <option value="USER" th:selected="${user.role == 'USER'}">USER</option>
                                        <option value="ADMIN" th:selected="${user.role == 'ADMIN'}">ADMIN</option>
                                    </select>
                                </div>
                                <div class="col-6 col-md-2">
                                    <label class="form-label mb-1 d-block">Enabled</label>
                                    <div class="form-check">
                                        <input th:id="${'enabled-' + user.id}" name="enabled" type="checkbox" class="form-check-input" th:checked="${user.enabled}">
                                        <label class="form-check-label" th:for="${'enabled-' + user.id}">Yes</label>
                                    </div>
                                </div>
                                <div class="col-12 col-md-3">
                                    <label class="form-label mb-1">New Password</label>
                                    <input name="password" type="password" class="form-control form-control-sm" minlength="8" placeholder="Optional reset">
                                </div>
                                <div class="col-12 col-md-1 text-md-end">
                                    <button type="submit" class="btn btn-sm btn-outline-primary">Save</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>

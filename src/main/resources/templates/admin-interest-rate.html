<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interest Rates | Loan Tracking App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        .settings-shell { max-width: 64rem; }
        .settings-banner {
            background: linear-gradient(125deg, #0f172a, #1e3a8a 52%, #0b766e);
            color: #fff;
            border-radius: 8px;
            padding: 1.1rem 1.25rem;
        }
        .settings-title { margin: 0; font-size: 1.25rem; font-weight: 700; }
        .settings-subtitle { margin: 0.35rem 0 0; color: rgba(255,255,255,0.88); font-size: 0.92rem; }
        .surface-card {
            border: 1px solid #dbe4f0;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
        }
        .section-title {
            margin: 0;
            font-size: 0.9rem;
            font-weight: 700;
            color: #52607a;
            text-transform: uppercase;
        }
    </style>
</head>
<body class="bg-body-tertiary">
<header th:replace="~{fragments/header :: siteHeader('interest-rate')}"></header>

<main class="container py-4 settings-shell">
    <section class="settings-banner mb-3">
        <h1 class="settings-title">Loan Type Interest Rates</h1>
        <p class="settings-subtitle">Set the interest rate copied into new loan applications for each active loan type.</p>
    </section>

    <div th:if="${successMessage}" class="alert alert-success" role="alert" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>

    <div class="card surface-card">
        <div class="card-body">
            <h2 class="section-title mb-3">Active Loan Types</h2>
            <div class="d-grid gap-3">
                <form method="post" th:each="loanType : ${loanTypes}" action="/admin/interest-rate" class="border rounded p-3 bg-white">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" name="loanTypeId" th:value="${loanType.id}">
                    <div class="row g-3 align-items-end">
                        <div class="col-12 col-md-6">
                            <label class="form-label mb-1">Loan Type</label>
                            <div class="form-control-plaintext py-0 fw-semibold" th:text="${loanType.name}"></div>
                        </div>
                        <div class="col-12 col-md-4">
                            <label class="form-label mb-1">Interest Rate (%)</label>
                            <input name="interestRate" type="number" step="0.01" min="0" class="form-control form-control-sm" th:value="${loanType.interestRate}" required>
                        </div>
                        <div class="col-12 col-md-2 text-md-end">
                            <button type="submit" class="btn btn-sm btn-outline-primary">Save</button>
                        </div>
                    </div>
                </form>
                <div th:if="${#lists.isEmpty(loanTypes)}" class="text-center text-body-secondary py-4">
                    No active loan types are available.
                </div>
            </div>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>

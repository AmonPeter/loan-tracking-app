<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loans | Loan Tracking App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-body-tertiary">
<header th:replace="~{fragments/header :: siteHeader('loans')}"></header>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 mb-0">Loans</h1>
        <a class="btn btn-primary btn-sm" href="/loans/create">Create Loan</a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" role="alert" th:text="${successMessage}"></div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form method="get" action="/loans" class="row g-2 mb-3">
                <div class="col-12 col-md-6 col-lg-4">
                    <input type="text" name="q" class="form-control form-control-sm" placeholder="Search by applicant name or surname" th:value="${q}">
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-outline-primary btn-sm">Search</button>
                </div>
                <div class="col-auto" th:if="${q != null and !#strings.isEmpty(q)}">
                    <a class="btn btn-outline-secondary btn-sm" href="/loans">Clear</a>
                </div>
            </form>
            <h2 class="h5 mb-3">Captured Loans</h2>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Applicant</th>
                        <th>Region</th>
                        <th>Loan Type</th>
                        <th>Duration</th>
                        <th>Grace</th>
                        <th>Status</th>
                        <th class="text-end">Approved</th>
                        <th class="text-end">Disbursed</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="loan : ${loans}">
                        <td><a th:href="@{/loans/{id}(id=${loan.id})}" th:text="${'#' + loan.id}" class="text-decoration-none fw-semibold"></a></td>
                        <td>
                            <a th:href="@{/loans/{id}(id=${loan.id})}" class="text-decoration-none" th:text="${loan.applicantFirstName + ' ' + loan.applicantSurname}"></a>
                        </td>
                        <td th:text="${loan.region}"></td>
                        <td th:text="${loan.loanType}"></td>
                        <td th:text="${loan.durationMonths + ' months'}"></td>
                        <td th:text="${loan.gracePeriodDays + ' days'}"></td>
                        <td th:text="${loan.loanStatus}"></td>
                        <td class="text-end" th:text="${loan.approvedAmount}"></td>
                        <td class="text-end" th:text="${loan.disbursedAmount}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <nav class="mt-3" aria-label="Loans pagination">
                <ul class="pagination pagination-sm mb-0 justify-content-end">
                    <li class="page-item" th:classappend="${!hasPrevious} ? ' disabled'">
                        <a class="page-link" th:href="@{/loans(page=${currentPage - 1},q=${q})}">Previous</a>
                    </li>
                    <li class="page-item" th:each="pageNumber : ${pageNumbers}" th:classappend="${pageNumber == currentPage} ? ' active'">
                        <a class="page-link" th:href="@{/loans(page=${pageNumber},q=${q})}" th:text="${pageNumber + 1}"></a>
                    </li>
                    <li class="page-item" th:classappend="${!hasNext} ? ' disabled'">
                        <a class="page-link" th:href="@{/loans(page=${currentPage + 1},q=${q})}">Next</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loans | Loan Tracking App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        .loans-shell {
            max-width: 72rem;
        }
        .page-banner {
            background: linear-gradient(125deg, #0f172a, #1e3a8a 52%, #0b766e);
            color: #fff;
            border-radius: 8px;
            padding: 1.1rem 1.25rem;
        }
        .page-title {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 700;
        }
        .page-subtitle {
            margin: 0.35rem 0 0;
            color: rgba(255, 255, 255, 0.88);
            font-size: 0.92rem;
        }
        .surface-card {
            border: 1px solid #dbe4f0;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
        }
        .search-input {
            border-radius: 8px;
            border-color: #d2dbea;
        }
        .section-title {
            margin: 0;
            font-size: 0.9rem;
            font-weight: 700;
            color: #52607a;
            text-transform: uppercase;
        }
        .loans-table thead th {
            font-size: 0.78rem;
            text-transform: uppercase;
            color: #52607a;
            background: #f8fafc;
            border-bottom-width: 1px;
            white-space: nowrap;
        }
        .loans-table td {
            vertical-align: middle;
        }
        .status-badge {
            padding: 0.35rem 0.55rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0;
            border: 1px solid transparent;
        }
        .status-initiation {
            background: #eff6ff;
            color: #1d4ed8;
            border-color: #bfdbfe;
        }
        .status-approved {
            background: #ecfdf5;
            color: #047857;
            border-color: #a7f3d0;
        }
        .status-withdrawn {
            background: #fff7ed;
            color: #c2410c;
            border-color: #fed7aa;
        }
        .status-declined {
            background: #fef2f2;
            color: #b91c1c;
            border-color: #fecaca;
        }
        .amount-cell {
            font-variant-numeric: tabular-nums;
        }
        .pagination {
            flex-wrap: wrap;
            gap: 0.2rem;
        }
        .pagination .page-link {
            border-radius: 8px;
            margin-left: 0;
            color: #1f3f85;
        }
        .pagination .page-item.active .page-link {
            background-color: #1f3f85;
            border-color: #1f3f85;
            color: #fff;
        }
        .pagination .page-link:hover,
        .pagination .page-link:focus {
            color: #143164;
        }
    </style>
</head>
<body class="bg-body-tertiary">
<header th:replace="~{fragments/header :: siteHeader('loans')}"></header>

<main class="container py-4 loans-shell">
    <div class="page-banner mb-3 d-flex justify-content-between align-items-start gap-3">
        <div>
            <h1 class="page-title">Loans</h1>
            <p class="page-subtitle">View and manage captured loan applications.</p>
        </div>
        <a class="btn btn-primary btn-sm" href="/loans/create">Create Loan</a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" role="alert" th:text="${successMessage}"></div>

    <div class="card surface-card">
        <div class="card-body">
            <form method="get" action="/loans" class="row g-2 mb-3 align-items-center">
                <div class="col-12 col-md-6 col-lg-4">
                    <input type="text" name="q" class="form-control form-control-sm search-input" placeholder="Search by applicant name or surname" th:value="${q}">
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-outline-primary btn-sm">Search</button>
                </div>
                <div class="col-auto" th:if="${q != null and !#strings.isEmpty(q)}">
                    <a class="btn btn-outline-secondary btn-sm" href="/loans">Clear</a>
                </div>
            </form>
            <h2 class="section-title mb-3">Captured Loans</h2>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0 loans-table">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Applicant</th>
                        <th>Region</th>
                        <th>Loan Type</th>
                        <th>Duration</th>
                        <th>Grace</th>
                        <th>Status</th>
                        <th class="text-end">Approved</th>
                        <th class="text-end">Disbursed</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="loan : ${loans}">
                        <td><a th:href="@{/loans/{id}(id=${loan.id})}" th:text="${'#' + loan.id}" class="text-decoration-none fw-semibold"></a></td>
                        <td>
                            <a th:href="@{/loans/{id}(id=${loan.id})}" class="text-decoration-none" th:text="${loan.applicantFirstName + ' ' + loan.applicantSurname}"></a>
                        </td>
                        <td th:text="${loan.region}"></td>
                        <td th:text="${loan.loanType}"></td>
                        <td th:text="${loan.durationMonths + ' months'}"></td>
                        <td th:text="${loan.gracePeriodDays + ' days'}"></td>
                        <td>
                            <span
                                class="status-badge"
                                th:classappend="${
                                    loan.loanStatus == 'Approved' ? ' status-approved' :
                                    (loan.loanStatus == 'Withdrawn' ? ' status-withdrawn' :
                                    (loan.loanStatus == 'Declined' ? ' status-declined' : ' status-initiation'))
                                }"
                                th:text="${loan.loanStatus}">
                            </span>
                        </td>
                        <td class="text-end amount-cell" th:text="${#numbers.formatDecimal(loan.approvedAmount, 1, 'COMMA', 2, 'POINT')}"></td>
                        <td class="text-end amount-cell" th:text="${#numbers.formatDecimal(loan.disbursedAmount, 1, 'COMMA', 2, 'POINT')}"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(loans)}">
                        <td colspan="9" class="text-center text-body-secondary py-4">No loans found.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <nav class="mt-3" aria-label="Loans pagination" th:if="${totalPages > 1}">
                <ul class="pagination pagination-sm mb-0 justify-content-end">
                    <li class="page-item" th:classappend="${!hasPrevious} ? ' disabled'">
                        <a class="page-link" th:href="@{/loans(page=${currentPage - 1},q=${q})}">Previous</a>
                    </li>
                    <th:block th:each="pageNumber : ${pageNumbers}">
                        <li class="page-item disabled" th:if="${pageNumber == -1}">
                            <span class="page-link">...</span>
                        </li>
                        <li class="page-item" th:if="${pageNumber != -1}" th:classappend="${pageNumber == currentPage} ? ' active'">
                            <a class="page-link" th:href="@{/loans(page=${pageNumber},q=${q})}" th:text="${pageNumber + 1}"></a>
                        </li>
                    </th:block>
                    <li class="page-item" th:classappend="${!hasNext} ? ' disabled'">
                        <a class="page-link" th:href="@{/loans(page=${currentPage + 1},q=${q})}">Next</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>

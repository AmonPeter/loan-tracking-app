<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password | Loan Tracking App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-body-tertiary">
<header th:replace="~{fragments/header :: siteHeader('account-password')}"></header>

<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">
            <div th:if="${successMessage}" class="alert alert-success" role="alert" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>

            <div class="card shadow-sm">
                <div class="card-body">
                    <h1 class="h5 mb-3">Change Password</h1>
                    <form method="post" action="/account/password" class="row g-3">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div class="col-12">
                            <label for="currentPassword" class="form-label">Current Password</label>
                            <input id="currentPassword" name="currentPassword" type="password" class="form-control" autocomplete="current-password" required>
                        </div>
                        <div class="col-12">
                            <label for="newPassword" class="form-label">New Password</label>
                            <input id="newPassword" name="newPassword" type="password" class="form-control" autocomplete="new-password" minlength="8" required>
                        </div>
                        <div class="col-12">
                            <label for="confirmPassword" class="form-label">Confirm New Password</label>
                            <input id="confirmPassword" name="confirmPassword" type="password" class="form-control" autocomplete="new-password" minlength="8" required>
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-primary w-100">Change Password</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>

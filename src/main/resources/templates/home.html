<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Tracking App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-body-tertiary">
<header th:replace="~{fragments/header :: siteHeader('home')}"></header>
<main class="container py-4">
    <h1 class="h3 mb-2">Loan Tracking App</h1>
    <p class="text-body-secondary mb-4">Signed in successfully.</p>

    <div class="row g-3" style="max-width: 56rem;">
        <div class="col-12 col-md-6">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h2 class="h6 text-body-secondary mb-2">Total Amount Approved</h2>
                    <div class="h3 mb-0" th:text="${#numbers.formatDecimal(totalApprovedAmount, 1, 'COMMA', 2, 'POINT')}"></div>
                </div>
            </div>
        </div>
        <div class="col-12 col-md-6">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h2 class="h6 text-body-secondary mb-2">Total Amount Disbursed</h2>
                    <div class="h3 mb-0" th:text="${#numbers.formatDecimal(totalDisbursedAmount, 1, 'COMMA', 2, 'POINT')}"></div>
                </div>
            </div>
        </div>
    </div>
    <p class="text-body-secondary small mt-3 mb-0">Totals shown above include only loans with status set to Approved.</p>
    <div class="row g-3 mt-1" style="max-width: 56rem;">
        <div class="col-12">
            <h2 class="h6 text-body-secondary mb-0">Total Loans by Status</h2>
        </div>
        <div class="col-12 col-md-6 col-lg-3" th:each="entry : ${totalLoansByStatus}">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h3 class="h6 text-body-secondary mb-2" th:text="${entry.key}"></h3>
                    <div class="h3 mb-0" th:text="${entry.value}"></div>
                </div>
            </div>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
